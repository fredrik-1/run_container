name: run container

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  id-token: write   # Required for Workload Identity Federation
  contents: read

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1036908354484/locations/global/workloadIdentityPools/github-pool/providers/github-provider2
          service_account: github-invoker@learn-bq-514121.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ secrets.PIPELINE_URL }}
          id_token_include_email: true

      - name: Send GET request
        run: |
          curl --fail --silent --show-error --max-time 1500 \
            -H "Authorization: Bearer ${{ steps.auth.outputs.id_token }}" \
            "${{ secrets.PIPELINE_URL }}"